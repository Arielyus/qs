<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script src="js/qrcode.min.js"></script>
    <style>
        *{
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }
        body {
            padding-top: 50px;
            padding-bottom: 20px;
            margin: 0;
        }

        /* Wrapping element */
        /* Set some basic padding to keep content from hitting the edges */
        .body-content {
            padding-left: 15px;
            padding-right: 15px;

        }

        /* Set widths on the form inputs since otherwise they're 100% wide */
        input,
        select,
        textarea {
            max-width: 280px;
        }

        /* Carousel */
        .carousel-caption p {
            font-size: 20px;
            line-height: 1.4;
        }

        /* Make .svg files in the carousel display properly in older browsers */
        .carousel-inner .item img[src$=".svg"] {
            width: 100%;
        }

        /* Hide/rearrange for smaller screens */
        @media screen and (max-width: 767px) {

            /* Hide captions */
            .carousel-caption {
                display: none
            }
        }


        #qrcode {
            width: 160px;
            height: 160px;
            margin-top: 55px;
            margin-left: 55px;
            position: absolute;
        }

        #apk {
            width: 40px;
            height: 40px;
        }

        #innerDiv {

            margin: auto;
            margin-top: 50px;
            width: 370px;
            height: 370px;
            background-color: #c9e3ac;
            border-radius: 50%;
        }

        body {
            background-color: #eaefbd;
        }

        .loader {
            position: absolute;
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 370px;
            height: 370px;
            animation: spin 2s linear infinite;
        }


        @-moz-keyframes spin {
            100% {
                -moz-transform: rotate(360deg);
            }
        }

        @-webkit-keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        .fadeOut {}

        /*Checkmark*/

        .checkmarkDiv {
            margin-top: 153px;
            margin-left: 157px;
            position: fixed;
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #7ac142;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: none;
            stroke-width: 2;
            stroke: #fff;
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px #7ac142;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {

            0%,
            100% {
                transform: none;
            }

            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 30px #7ac142;
            }
        }
    </style>
</head>

<body onload="showQR();">
    <input id="id" type="hidden" value="{id}" />
    <div id="innerDiv">
        <div class="loader fadeOut"></div>
        <div class="checkmarkDiv">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
        </div>

        <div id="qrcode" class="fadeOut"></div>
    </div>
    <div id="apk"><a href="/apk/Qsend.apk">Download Apk</a></div>
</body>
<script>
    var redirectUrl = '';
    function getUrl() {
        const id = document.getElementById('id').value;
        const data = { id: id };
        // fetch("/GetUrl", function (data) { redirect(data); });
        fetch('/getUrl', {
            method: 'POST', // *GET, POST, PUT, DELETE, etc.
            // mode: 'cors', // no-cors, *cors, same-origin
            // cache: 'no-cache', // *default, no-cache, reload, force-cache, only-if-cached
            // credentials: 'same-origin', // include, *same-origin, omit
            headers: {
                'Content-Type': 'application/json'
                // 'Content-Type': 'application/x-www-form-urlencoded',
            },
            redirect: 'follow', // manual, *follow, error
            referrerPolicy: 'no-referrer', // no-referrer, *no-referrer-when-downgrade, origin, origin-when-cross-origin, same-origin, strict-origin, strict-origin-when-cross-origin, unsafe-url
            body: JSON.stringify(data) // body data type must match "Content-Type" header
        })
            .then(res => res.text())
            .then(text => redirect(text));

    }

    function redirect(url) {
        if (url === "") {
            setTimeout(getUrl, 1000);
        } else {
            const elementsToFadeOut = document.querySelectorAll(".fadeOut");
            for (var el of elementsToFadeOut) {
                el.style.display = 'none';
            }
            document.querySelector(".checkmark").style.display = 'block';
            setTimeout(function () { window.location.replace(url); }, 1000);
        }
    }

    function showQR() {
        var id = document.getElementById("id");
        var qrcode = new QRCode("qrcode");
        qrcode.makeCode(id.value);
        getUrl();
    }
</script>

</html>
